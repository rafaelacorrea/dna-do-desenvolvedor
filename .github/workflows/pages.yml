# Publica a cena no GitHub Pages e mantem os perfis atualizados.
#
# O Pages nao roda Python, entao a coleta acontece aqui: o workflow chama o
# proprio CLI para regerar cada perfil que ja existe na pasta de dados e sobe
# o resultado junto com a cena. O token e o automatico do Actions, que da
# 1000 requisicoes por hora na API do GitHub - nenhum token precisa ser criado
# a mao nem guardado no repositorio.

name: Publicar no Pages

on:
  push:
    branches: [main]
  schedule:
    # Todo dia as 6h UTC, para os perfis nao envelhecerem.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rodar os testes
        run: python -m unittest discover -s testes -t .

      - name: Atualizar os perfis da colecao
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for arquivo in web/dados/*.json; do
            nome=$(basename "$arquivo" .json)
            if [ "$nome" = "index" ]; then
              continue
            fi
            # Um perfil que falhar nao derruba a publicacao: o JSON commitado
            # continua valendo.
            python dna_cli.py "$nome" || echo "falhou: $nome"
          done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: publicacao
        uses: actions/deploy-pages@v4
